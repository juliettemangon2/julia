<style>
/* ------------------------------ */
/*      COLOR VARIABLES           */
/* ------------------------------ */
:root {
  --darlington: #ACCA82;
  --beeswax: #e9d562;
  --grenadine: #d95402;
  --cafe-latte: #9B9180;
  --lavender: #7c6a85;
  --ice-blue: #D9E8E8;
  --turquoise: #7EC5C0;
  --cream: #FFF9F0;
  --charcoal: #383838;
  --lightyellow2: #ffeec0;
}

/* ------------------------------ */
/*        GLOBAL RESET            */
/* ------------------------------ */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--cream);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
  overflow: hidden;
}

/* ------------------------------ */
/*       LANDING CONTAINER        */
/* ------------------------------ */
#landing {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* ------------------------------ */
/*         STAR SVG ICON          */
/* ------------------------------ */
#landing-star {
  width: 400px;
  height: auto;
  opacity: 0;
  transform: scale(0.6);
  animation: starFadeIn 1s ease forwards;
  margin-bottom: 2rem;
}

#landing-star polygon {
  fill: var(--beeswax);
}

/* ------------------------------ */
/*        NAME TITLE              */
/* ------------------------------ */
#landing-name {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
  font-size: 5rem;
  font-weight: 500;
  letter-spacing: 0rem;
  letter-spacing: -0.02rem;
  text-transform: uppercase;
  line-height: 1.1;
  color: var(--grenadine);
  opacity: 0;
  animation: nameFade 1s ease forwards 0.4s;
  transition: all 0.9s ease;
}

/* ------------------------------ */
/*           ENTER BUTTON         */
/* ------------------------------ */
#enter-btn {
  margin-top: 2.5rem;
  position: relative;
  border: 6px solid var(--beeswax);
  background: white;
box-shadow: 0 0 0 8px var(--ice-blue) inset;
  padding: 1.4rem 2.4rem 1.1rem;
  font-size: 1rem;
  letter-spacing: 0.17rem;
  text-transform: uppercase;
  color: var(--charcoal);
  cursor: pointer;
  opacity: 0;
  font-weight: 800;
  transform: translateY(8px);
  animation: buttonFade 1s ease forwards 1s;
}



#enter-btn span { position: relative; z-index: 1; }

/* ------------------------------ */
/*       EXIT ANIMATION STATE     */
/* ------------------------------ */
body.landing-finished #enter-btn {
  opacity: 0;
  transform: translateY(12px);
  transition: 0.6s ease;
}

body.landing-finished #landing-name {
  position: fixed;
  top: 0rem;
  right: 0rem;
  text-align: right;
  font-size: 2rem;
  color: var(--grenadine);
}

body.landing-finished #landing-star {
  transform: scale(0.8);
  transition: transform 0.7s ease;
}

/* ------------------------------ */
/*          KEYFRAMES             */
/* ------------------------------ */
@keyframes starFadeIn {
  to { opacity: 1; transform: scale(1); }
}
@keyframes nameFade {
  to { opacity: 1; }
}
@keyframes buttonFade {
  to { opacity: 1; transform: translateY(0); }
}
/* ------------------------------ */
/*        MOBILE RESPONSIVE       */
/* ------------------------------ */

/* Medium screens: tablets */
@media (max-width: 900px) {

  #landing-star {
    width: 260px;
    margin-bottom: 1.5rem;
  }

  #landing-name {
    font-size: 3.4rem;
  }

  #enter-btn {
    padding: 1.1rem 2rem 0.9rem;
    font-size: 0.9rem;
    border-width: 5px;
  }

  body.landing-finished #landing-name {
    font-size: 1.7rem;
    right: 1rem;
  }
}

/* Small screens: most phones */
@media (max-width: 600px) {

  #landing {
    padding: 0 1rem;
  }

  #landing-star {
    width: 200px;
    margin-bottom: 1.2rem;
    transform-origin: center;
  }

  #landing-name {
     font-size: 2rem;
    letter-spacing: -0.01rem;
  }

  #enter-btn {
    padding: 1rem 1.7rem 0.8rem;
    font-size: 0.85rem;
    letter-spacing: 0.14rem;
    border-width: 4px;
    box-shadow: 0 0 0 6px var(--ice-blue) inset;
  }

  body.landing-finished #landing-name {

    font-size: 2.5rem;
  }
}

/* Very small screens: small iPhones, older devices */
@media (max-width: 400px) {

  #landing-star {
    width: 160px;
  }

  #landing-name {
     font-size: 2rem;
  }

  #enter-btn {
    padding: 0.85rem 1.4rem 0.7rem;
    font-size: 0.75rem;
    border-width: 4px;
  }

  body.landing-finished #landing-name {
     font-size: 2.5rem;
  }
}

</style>
