<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julia Majchrzak</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <!-- match site fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- your shared styles -->
  <link rel="stylesheet" href="style.css" />

  <style>
    :root {
      /* final header Y position for the stack when it rises */
      --header-top: 18px;
      /* tweak if needed */
    }

    /* Page baseline */
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--lightgray);
      color: var(--lightyellow2);
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    /* DECORATIVE IMAGES (behind the name) */
    .decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      /* never block clicks */
      z-index: 0;
      /* stay behind the name/logo stack */
    }

    .decor img {
      position: absolute;
      height: auto;
      opacity: 0;
      /* grow-in start */
      transform: scale(.92);
      transition:
        opacity 420ms ease,
        transform 600ms cubic-bezier(.2, .8, .2, 1);
      will-change: opacity, transform;
    }

    /* Default positions (you can tweak offsets/sizes later in style.css if you want).
       These are placed "around" center so they shouldn't overlap the name.
       Sizes use clamp to stay responsive but not huge. */
    .decor .fish {
      width: clamp(200px, 28vw, 420px);
      right: 8%;
      top: 0%;
      /* raise them upward (was 5%) */
    }

    /* left-side flowers */
    .decor .flowers {
      width: clamp(200px, 28vw, 420px);
      left: 5%;
      bottom: -3%;
      /* move slightly lower (was 0%) */
      top: auto;
      transform: scaleX(-1) scale(.92);
    }

    .decor .flowers.in {
      transform: scaleX(-1) scale(1);
    }

    .decor .leaves {
      width: clamp(110px, 17vw, 240px);
      left: 6%;
      bottom: 10%;
    }

    /* Centered stack (logo + button) */
    .stack {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      /* exact center */
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: top, transform;
      transition: top 800ms cubic-bezier(.2, .8, .2, 1),
        transform 800ms cubic-bezier(.2, .8, .2, 1);
      z-index: 1;
      transform: translate(-50%, calc(-50% + 5vh));
      /* above decor */
    }

    /* Logo size (start) + grow-in */
    .logo {
      height: clamp(6rem, 18vw, 10rem);
      opacity: 0;
      /* grow-in start */
      transform: scale(.92);
      /* start a bit smaller */
      transition:
        height 800ms cubic-bezier(.2, .8, .2, 1),
        opacity 420ms ease,
        transform 600ms cubic-bezier(.2, .8, .2, 1);
      will-change: height, opacity, transform;
    }

    .logo img {
      display: block;
      height: 100%;
      width: auto;
    }

    /* Button sits 1.5rem under the logo, always */
    .cta {
      margin-top: 1.5rem;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 600;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--coffee);
      display: inline-flex;
      gap: 0.25rem;
      position: relative;
      border-bottom: 7px dotted var(--orange);
      /* always visible */
      transition:
        padding-left 250ms ease,
        padding-right 250ms ease,
        border-color 200ms ease,
        transform 200ms ease,
        opacity 300ms ease;
    }

    /* Rainbow text colors stay as you had them */



    .cta:hover {
      transform: translateY(-2px) scaleX(1.15);
      /* subtle stretch effect */
      border-color: var(--coffee);
      /* dotted line turns coffee */
    }

    /* Each letter as its own span so we can color them individually */
    .cta span:nth-child(1) {
      color: var(--flame);
    }

    .cta span:nth-child(2) {
      color: var(--olive);
    }

    .cta span:nth-child(3) {
      color: var(--blue);
    }

    .cta span:nth-child(4) {
      color: var(--purple);
    }

    .cta span:nth-child(5) {
      color: var(--orange);
    }

    .cta span:nth-child(6) {
      color: var(--copper);
    }

    .cta span:nth-child(7) {
      color: var(--goldenbrown);
    }

    .cta span:nth-child(8) {
      color: var(--lightgreen2);
    }

    .cta span:nth-child(9) {
      color: var(--flame);
    }

    .cta span:nth-child(10) {
      color: var(--yellow);
    }

    .cta:hover {
      border-color: var(--coffee);
      padding-left: 1.9rem;
      /* was 1.6rem */
      padding-right: 1.9rem;
      /* was 1.6rem */
      transform: translateY(-2px);
    }

    /* dotted underline that appears on hover */
    .cta::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;

      opacity: 0;
      transition: opacity 200ms ease;
    }

    .cta:hover::after {
      opacity: 1;
    }


    .cta:active {
      transform: translateY(12px);
    }

    /* Staggered reveal classes (added via JS) */
    .logo.in {
      opacity: 1;
      transform: scale(1);
    }

    .decor img.in {
      opacity: 1;
      transform: scale(1);
    }

    /* Keep flowers always flipped while preserving the grow-in scale */
    .decor .flowers {
      transform: scaleX(-1) scale(.92);
    }

    .decor .flowers.in {
      transform: scaleX(-1) scale(1);
    }

    .decor .flowers.in {
      transform: scaleX(-1) scale(1);
      /* keep flipped + grow-in end */
    }

    /* Right-side flowers (using the .fish class) — raise it */
    .decor .fish {
      width: clamp(200px, 28vw, 420px);
      right: 0%;
      top: 5%;
      /* keep your anchor */
      /* nudge upward: negative translateY moves it up */
      transform: scale(.92) translateY(-210px);
    }

    .decor .fish.in {
      /* keep the nudge after grow-in finishes */
      transform: scale(1) translateY(-210px);
    }


    .cta.in {
      opacity: 1;
      transform: translateY(0);
    }

    /* Click/enter animation:
       - Stack moves up to header
       - Logo shrinks to header size (already defined)
       - Button fades out
       - Decor fades out (NOT the name) */
    .enter .stack {
      top: var(--header-top);
      transform: translate(-50%, 0);
      /* keep centered horizontally; move straight up */
    }

    .enter .logo {
      height: 4.7rem;
      /* desktop header size */
    }

    .enter .cta {
      opacity: 0;
      pointer-events: none;
    }

    .enter .decor img {
      opacity: 0;
      transition: opacity 350ms ease;
    }

    /* make the logo scale down smoothly on smaller screens */
    @media (max-width: 900px) {
      .logo {
        height: clamp(4.5rem, 12vw, 8rem);
      }
    }

    @media (max-width: 700px) {
      .logo {
        height: clamp(3.8rem, 14vw, 6.5rem);
      }
    }

    @media (max-width: 500px) {
      .logo {
        height: clamp(2.7rem, 18vw, 5rem);
      }
    }


    /* Mobile header target for logo size */
    @media (max-width: 600px) {
      .enter .logo {
        height: 2.7rem;
      }
    }

    /* Mobile layout adjustments */
    @media (max-width: 600px) {

      /* hide decorative images */
      .decor {
        display: none !important;
      }

      /* make name start at header size (no grow/shrink animation) */
      .logo {
        height: 2.7rem !important;
        /* same as about.html final size */
        opacity: 1 !important;
        /* already visible */
        transform: none !important;
        /* no scale in/out */
        transition: none !important;
      }

      /* also prevent the logo from resizing on click */
      .enter .logo {
        height: 2.7rem !important;
      }

      /* keep stack centered and aligned for smaller screens */
      .stack {
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* keep button visible and sized appropriately */
      .cta {
        font-size: 1rem;
        padding: 0.8rem 1.4rem;
      }
    }


    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {

      .stack,
      .logo,
      .cta,
      .decor img {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Decorative images behind the name -->
  <div class="decor" aria-hidden="true">
    <img class="fish" src="landing/flowers.png" alt="">
    <img class="flowers" src="landing/flowers.png" alt="">
  </div>

  <div class="stack" role="main" aria-label="Landing">
    <div class="logo" aria-label="Julia Majchrzak">
      <img src="name.png" alt="Julia Majchrzak" />
    </div>
    <button class="cta" id="explore">
      <span>E</span><span>n</span><span>t</span><span>e</span><span>r</span>
      <span> </span><span> </span>
      <span>H</span><span>e</span><span>r</span><span>e</span>
    </button>

  </div>

  <script>
    (function () {
      const btn = document.getElementById('explore');
      const logo = document.querySelector('.logo');
      const decorImgs = Array.from(document.querySelectorAll('.decor img'));
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Staggered grow-in: name first, then decor, then button
      function stagedReveal() {
        if (prefersReduced) {
          // Show everything immediately without animation
          logo.classList.add('in');
          decorImgs.forEach(img => img.classList.add('in'));
          btn.classList.add('in');
          return;
        }
        // Name first
        setTimeout(() => { logo.classList.add('in'); }, 50);
        // Then the three pngs
        setTimeout(() => {
          decorImgs.forEach((img, i) => {
            setTimeout(() => img.classList.add('in'), i * 120);
          });
        }, 220);
        // Then button slides in
        setTimeout(() => { btn.classList.add('in'); }, 620);
      }

      function go() {
        btn.disabled = true;
        if (prefersReduced) {
          window.location.href = 'about.html';
          return;
        }
        document.body.classList.add('enter');

        // CSS duration = 800ms; add a buffer
        setTimeout(function () {
          window.location.href = 'about.html';
        }, 900);
      }

      // Run on load
      window.addEventListener('DOMContentLoaded', stagedReveal);

      // Click handlers
      btn.addEventListener('click', go);
      btn.addEventListener('keyup', function (e) {
        if (e.key === 'Enter' || e.key === ' ') go();
      });
    })();
  </script>
</body>

</html>
